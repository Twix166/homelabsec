name: homelabsecrets

# Example only. Do not run this as-is without Robert-present bootstrap.
# Runtime env files referenced below must be generated outside Git with 0600 perms.

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    env_file:
      - ../secrets/runtime/vaultwarden.env
    environment:
      DOMAIN: ${VAULTWARDEN_DOMAIN:-https://vaultwarden.home.robertbalm.com}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      WEBSOCKET_ENABLED: ${VAULTWARDEN_WEBSOCKET_ENABLED:-true}
    volumes:
      - vaultwarden-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/alive || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:8222:80"

  openbao:
    build:
      context: ..
      dockerfile: infra/openbao/Dockerfile
    image: homelabsec/openbao-curl:latest
    container_name: openbao
    restart: unless-stopped
    env_file:
      - ../secrets/runtime/openbao.env
    environment:
      BAO_ADDR: ${BAO_ADDR:-http://127.0.0.1:8200}
    command: ["server", "-config=/bao/config/openbao.hcl"]
    volumes:
      - ../infra/openbao/openbao.hcl:/bao/config/openbao.hcl:ro
      - openbao-data:/bao/file
      - openbao-logs:/bao/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:8200:8200"

volumes:
  vaultwarden-data:
  openbao-data:
  openbao-logs:
